<!-- Scrivi un programma che quando premi un bottone mostri un messaggio di saluto 
(es. “Ciao Studente!”) cambiando il testo di un elemento con getElementById e 
textContent. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="index.js" defer></script>
    <title>Messaggio Saluto</title>
</head>
<body>
    <h1>Messaggio di saluto</h1>
    <p>Schiaccia il bottone per ricevere un saluto..</p>
    <button id="button">Saluto x Studente</button><br><br>
    <p id="messaggio"></p>
</body>
</html>
