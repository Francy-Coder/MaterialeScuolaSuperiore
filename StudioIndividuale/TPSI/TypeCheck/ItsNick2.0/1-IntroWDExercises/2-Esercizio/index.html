<!-- Crea due caselle di input per inserire due numeri e un bottone che, quando premuto, 
calcoli e mostri la loro somma sullo schermo usando getElementById e textContent. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="index.js" defer></script>
    <title>Document</title>
</head>
<body>
    <h1>Calcolo Somma</h1>
    Primo Numero: <input type="number" id="primoNumero"><br><br>
    Secondo Numero: <input type="number" id="secondoNumero"><br><br>
    <button id="sommaBtn">Somma</button><br><br>
    <p id="risultato"></p>
</body>
</html>
